name: Validate IaC and container
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Install pipeline test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/pipeline-tests"
          "$RUNNER_TEMP/pipeline-tests/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$RUNNER_TEMP/pipeline-tests/bin" >> "$GITHUB_PATH"
      - name: Install the pinned workflow linter
        run: bash scripts/install-actionlint.sh
      - name: Validate pipeline policy and workflow structure
        run: bash scripts/check-pipeline.sh
      - name: Validate approved modules, mocked plans and source-policy equivalence
        run: |
          if [[ -f scripts/check-ingest.sh ]]; then
            bash scripts/check-ingest.sh
          else
            bash scripts/check-security.sh
          fi
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build and self-test the demonstration image without Azure access
        run: python3 scripts/pipeline/run.py build-local
  tfsec:
    # Independent job: another linter's failure must not hide tfsec's result.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Install checksum-pinned tfsec
        run: python3 scripts/tfsec.py install
      - name: Scan Terraform modules and environments with tfsec
        run: python3 scripts/tfsec.py scan
      - name: Verify tfsec rejects public SSH and accepts the correction
        run: python3 scripts/tfsec.py test-detection
  static-analysis:
    # TFLint (with the AzureRM ruleset) and Checkov over every root and module.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: Lint Terraform with TFLint
        env:
          # Read-only token to download the pinned AzureRM ruleset.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact
      - name: Install the pinned Checkov
        run: |
          python3 -m venv "$RUNNER_TEMP/checkov"
          "$RUNNER_TEMP/checkov/bin/python" -m pip install --disable-pip-version-check checkov==3.3.26
          echo "$RUNNER_TEMP/checkov/bin" >> "$GITHUB_PATH"
      - name: Scan Terraform with Checkov
        run: checkov --config-file .checkov.yaml
